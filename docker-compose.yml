services:
  patchstash:
    build: .
    # To use a pre-built image from a registry instead of building locally:
    # image: ghcr.io/yourname/patchstash:latest
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - DB_PATH=/app/data/patchstash.db
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    restart: unless-stopped
    # Healthcheck: Docker will restart the container if the server stops responding
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/auth"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
